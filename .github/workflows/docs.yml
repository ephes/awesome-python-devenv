name: Documentation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bootstrap-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s tests -v
